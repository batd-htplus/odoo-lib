; =============================================================================
; Odoo 18 - DEVELOPMENT configuration
; =============================================================================
; Rendered at container start by /entrypoint.sh (envsubst).
; Placeholders ${...} are replaced from environment variables.
; DO NOT use this file in production.
; =============================================================================

[options]

; --- Paths -------------------------------------------------------------------
; First-party modules first, then vendor modules, then core. Odoo resolves
; a module name against this list in order, so a first-party module always
; wins over a vendor module of the same name.
addons_path = /mnt/extra-addons,/mnt/vendor-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; --- Database ----------------------------------------------------------------
; db_host / db_port / db_user / db_password are injected as CLI args by the
; entrypoint (from env or *_FILE secrets). Do not hardcode them here.
db_maxconn = 16
db_template = template0
; In dev we allow the database manager so you can create/drop test DBs.
list_db = True
dbfilter =

; --- Master password ---------------------------------------------------------
admin_passwd = ${ODOO_ADMIN_PASSWD}

; --- HTTP --------------------------------------------------------------------
http_enable = True
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
; nginx sits in front even in dev so that /websocket behaves like prod.
proxy_mode = True

; --- Workers -----------------------------------------------------------------
; workers = 0 -> threaded mode. Simpler to attach a debugger, and the gevent
; port still works because Odoo runs the bus in a thread in this mode.
workers = 0
max_cron_threads = 1

; --- Limits (generous: long debugger pauses must not kill the worker) --------
limit_time_cpu = 3600
limit_time_real = 3600
limit_time_real_cron = 3600
limit_request = 65536

; --- Developer tooling -------------------------------------------------------
; reload    : restart on .py change
; qweb      : do not cache QWeb templates
; xml       : reload XML views from file on each render
; assets    : serve JS/CSS unminified and unbundled
dev_mode = reload,qweb,xml,assets
without_demo = ${ODOO_WITHOUT_DEMO}

; --- Logging -----------------------------------------------------------------
; Empty logfile => stdout => visible via `docker compose logs -f odoo`.
logfile =
log_level = ${ODOO_LOG_LEVEL}
log_handler = :INFO,werkzeug:WARNING
log_db = False

; --- Misc --------------------------------------------------------------------
unaccent = True
server_wide_modules = base,web
; x_sendfile stays off in dev: Odoo serves the filestore itself.
x_sendfile = False
