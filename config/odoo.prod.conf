; =============================================================================
; Odoo 18 - PRODUCTION configuration
; =============================================================================
; Rendered at container start by /entrypoint.sh (envsubst).
; Placeholders ${...} are replaced from environment variables / docker secrets.
;
; Sizing rule of thumb (N = physical CPU cores available to the container):
;   workers          = 2*N + 1
;   max_cron_threads = 1..2   (counted OUTSIDE `workers`)
;   RAM needed       ~ (workers + max_cron_threads) * limit_memory_hard
; Set them via .env.prod (ODOO_WORKERS, ODOO_CRON_THREADS, ...).
; =============================================================================

[options]

; --- Paths -------------------------------------------------------------------
; First-party modules first, then vendor modules, then core. Odoo resolves
; a module name against this list in order, so a first-party module always
; wins over a vendor module of the same name.
addons_path = /mnt/extra-addons,/mnt/vendor-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo

; --- Database ----------------------------------------------------------------
; Credentials are injected as CLI args by the entrypoint from docker secrets.
; NEVER write db_password here.
db_maxconn = ${ODOO_DB_MAXCONN}
db_template = template0
db_sslmode = prefer

; Hard lock-down of the database manager:
;   list_db = False  -> /web/database/manager, selector and backup UI disabled
;   dbfilter         -> exactly one database is reachable
list_db = False
; Anchored on both sides so only this exact database name is served. The `$`
; anchor is written here rather than in the .env file, because a trailing `$`
; in an env value trips docker compose's interpolation.
dbfilter = ^${ODOO_DB_NAME}$

; --- Master password ---------------------------------------------------------
; Still required by Odoo internals. Must be a long random string, supplied via
; the `odoo_admin_passwd` docker secret. Rotate on every credential rotation.
admin_passwd = ${ODOO_ADMIN_PASSWD}

; --- HTTP --------------------------------------------------------------------
http_enable = True
; Bind to all interfaces *inside* the compose network only; the container
; publishes no ports, nginx is the single entry point.
http_interface = 0.0.0.0
http_port = 8069
gevent_port = 8072
; MANDATORY behind nginx: makes Odoo trust X-Forwarded-* and build https:// URLs.
proxy_mode = True

; --- Workers -----------------------------------------------------------------
workers = ${ODOO_WORKERS}
max_cron_threads = ${ODOO_CRON_THREADS}

; --- Limits ------------------------------------------------------------------
; soft: worker finishes the current request then recycles (graceful)
; hard: worker is killed immediately (leak guard)
limit_memory_soft = ${ODOO_LIMIT_MEMORY_SOFT}
limit_memory_hard = ${ODOO_LIMIT_MEMORY_HARD}
; CPU seconds per request. Report/import heavy? raise limit_time_cpu first.
limit_time_cpu = ${ODOO_LIMIT_TIME_CPU}
; Wall-clock per request. Must be > limit_time_cpu and < nginx proxy_read_timeout.
limit_time_real = ${ODOO_LIMIT_TIME_REAL}
; Cron jobs get their own budget (0 = unlimited; keep bounded to catch runaways).
limit_time_real_cron = ${ODOO_LIMIT_TIME_REAL_CRON}
; Requests served before a worker recycles - bounds slow memory growth.
limit_request = 8192

; --- Developer tooling: MUST be empty ----------------------------------------
dev_mode =
without_demo = all

; --- Logging -----------------------------------------------------------------
; stdout so Docker's json-file driver (with rotation) owns the logs.
logfile =
log_level = ${ODOO_LOG_LEVEL}
log_handler = :INFO,werkzeug:WARNING,odoo.http.rpc.request:WARNING,odoo.http.rpc.response:WARNING
; Never mirror the log into the database - it bloats and slows the DB.
log_db = False
syslog = False

; --- Misc --------------------------------------------------------------------
unaccent = True
; Loading only base,web keeps memory down; add modules here only if a module
; genuinely needs to hook before the registry is built.
server_wide_modules = base,web

; x_sendfile: hand filestore downloads (attachments, images) to nginx instead of
; occupying an Odoo worker for the whole transfer. Requires the matching
; `location /web/filestore` internal block in nginx/prod.conf. Enabled there.
x_sendfile = True

; Email is sent through the outgoing mail server configured in the UI, not here.
