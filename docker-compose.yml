x-logging: &default-logging
    driver: json-file
    options:
        max-size: "20m"
        max-file: "5"

services:
    db:
        image: postgres:17-alpine
        environment:
            # Credentials are NOT set here: dev supplies them from .env, prod from
            # docker secrets (*_FILE). Setting both would make the postgres
            # entrypoint refuse to start.
            POSTGRES_USER: ${POSTGRES_USER:-odoo}
            POSTGRES_DB: postgres
            # C collation + UTF8: Odoo creates databases from template0 anyway, this
            # only affects the maintenance database.
            POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
            PGDATA: /var/lib/postgresql/data/pgdata
        volumes:
            - db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        networks: [backend]
        restart: unless-stopped
        logging: *default-logging

    odoo:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                ODOO_VERSION: ${ODOO_VERSION:-18.0}
        image: ${IMAGE_PREFIX:-htplus}/odoo:${ODOO_VERSION:-18.0}
        depends_on:
            db:
                condition: service_healthy
        environment:
            HOST: db
            PORT: 5432
            USER: ${POSTGRES_USER:-odoo}
            WAIT_DB_TIMEOUT: 90
        volumes:
            # Filestore + sessions. Losing this volume means losing every attachment.
            - odoo-data:/var/lib/odoo
            # Custom addons, read-only in both environments: Odoo must never write
            # into its own source tree.
            - ./addons:/mnt/extra-addons:ro
            # Vendor modules are always read-only, in dev too: editing them
            # in place means the change is lost on the next vendor update.
            - ./addons_vendor:/mnt/vendor-addons:ro
        networks: [backend]
        restart: unless-stopped
        logging: *default-logging

    planning:
        build:
            context: ./services/planning
            dockerfile: Dockerfile
        image: ${IMAGE_PREFIX:-htplus}/planning-service:${PLANNING_SERVICE_VERSION:-0.1.0}
        environment:
            UVICORN_WORKERS: ${PLANNING_SERVICE_WORKERS:-2}
        networks: [backend]
        restart: unless-stopped
        logging: *default-logging

    nginx:
        image: nginx:1.27-alpine
        depends_on:
            odoo:
                condition: service_started
        environment:
            ODOO_DOMAIN: ${ODOO_DOMAIN:-localhost}
            # Only substitute placeholders whose name starts with ODOO_; nginx's own
            # runtime variables (host, remote_addr, scheme, ...) must survive
            # envsubst untouched.
            NGINX_ENVSUBST_FILTER: "^ODOO_"
        healthcheck:
            test: ["CMD-SHELL", "nginx -t >/dev/null 2>&1 || exit 1"]
            interval: 30s
            timeout: 5s
            retries: 3
        networks: [backend]
        restart: unless-stopped
        logging: *default-logging

networks:
    backend:
        driver: bridge

volumes:
    db-data:
    odoo-data:
